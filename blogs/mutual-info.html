<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-FBK41DCHCM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-FBK41DCHCM');
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutual Information - PAN Wenxin</title>
  <link rel="stylesheet" href="../style.css" />
  <script>
    MathJax = {
      loader: {load: ['[tex]/color']},
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        packages: {'[+]': ['color']}
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
  <header>
    <div class="header-inner">
      <a href="/" class="site-name">PAN Wenxin</a>
      <nav>
        <a href="/#blogs">Blogs</a>
        <a href="/#resources">Resources</a>
        <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">&#9680;</button>
      </nav>
    </div>
  </header>

  <article class="blog-page">
    <header class="blog-header">
      <h1>Mutual Information</h1>
      <div class="blog-meta">
        Created Oct 9, 2026&nbsp;&middot;&nbsp;<span class="last-updated"></span>&nbsp;&middot;&nbsp;<span class="read-time"></span>
      </div>
    </header>

    <nav class="toc">
      <details open>
        <summary class="toc-title">Contents</summary>
        <ol>
          <li><a href="#introduction">Introduction</a></li>
        </ol>
      </details>
    </nav>

    <div class="blog-body">
      <h2 id="introduction">Introduction</h2>
      <!-- Add blog content here. -->
    </div>
  </article>

  <footer>
    <div class="footer-inner">
      <p>&copy; 2026 PAN Wenxin</p>
    </div>
  </footer>

  <script>
    (function () {
      const el = document.querySelector('.last-updated');
      if (el) {
        const d = new Date(document.lastModified);
        const label = d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
        el.textContent = 'Last updated ' + label;
      }

      const body = document.querySelector('.blog-body');
      const rt = document.querySelector('.read-time');
      if (body && rt) {
        const words = body.innerText.trim().split(/\s+/).length;
        const mins = Math.max(1, Math.round(words / 200));
        rt.textContent = mins + ' min read';
      }
    })();
  </script>

  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      if (saved) document.documentElement.setAttribute('data-theme', saved);
      else if (window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.setAttribute('data-theme', 'dark');
    })();

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>

  <script>
    (function () {
      const headings = Array.from(document.querySelectorAll('.blog-body h2[id], .blog-body h3[id]'));
      const tocLinks = Array.from(document.querySelectorAll('.toc a'));
      if (!headings.length || !tocLinks.length) return;

      function getActive() {
        const threshold = window.scrollY + window.innerHeight * 0.25;
        let active = headings[0];
        for (const heading of headings) {
          if (heading.getBoundingClientRect().top + window.scrollY <= threshold) active = heading;
        }
        return active;
      }

      function update() {
        const activeId = getActive()?.id;
        tocLinks.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + activeId));
      }

      window.addEventListener('scroll', update, { passive: true });
      update();
    })();
  </script>
</body>
</html>
